services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goldhome
      POSTGRES_PASSWORD: goldhome
      POSTGRES_DB: goldhome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldhome"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://goldhome:goldhome@db:5432/goldhome?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-secret-in-production}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "3000:3000"

volumes:
  pgdata:
